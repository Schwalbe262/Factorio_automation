[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-agent"
version = "0.1.0"
description = "Deterministic Space Age autoplayer using resource-backed factory construction and RCON."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NEC" }]
dependencies = []

[project.optional-dependencies]
test = ["lupa>=2.2"]

[project.scripts]
factorio-agent = "factorio_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["runtime", "reference_blueprints"]

[tool.ruff.lint]
select = ["E9", "F"]
